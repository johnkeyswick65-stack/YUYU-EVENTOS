<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Bilhetes · Painel YUYU EVENTOS</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <header class="admin-header">
    <div class="admin-header-inner">
      <div class="admin-brand">
        <svg class="admin-brand-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="8" height="8" rx="1.5"></rect>
          <rect x="13" y="3" width="8" height="8" rx="1.5"></rect>
          <rect x="3" y="13" width="8" height="8" rx="1.5"></rect>
          <rect x="13" y="13" width="8" height="8" rx="1.5"></rect>
        </svg>
        <span class="admin-brand-text">YUYU <span class="admin-brand-accent">EVENTOS</span></span>
        <span class="admin-brand-badge">Painel</span>
      </div>
      <nav class="admin-nav">
        <a class="admin-nav-link" href="dashboard.html">Dashboard</a>
        <a class="admin-nav-link" href="eventos.html">Eventos</a>
        <a class="admin-nav-link is-active" href="bilhetes.html">Bilhetes</a>
        <a class="admin-nav-link" href="scanner.html">Scanner</a>
  <a class="admin-nav-link" href="armazenamento.html">Armazenamento</a>
        <a class="admin-nav-link" href="armazenamento.html">Armazenamento</a>
      </nav>
      <div class="admin-user">
        <span class="admin-username" id="nomeAdmin">—</span>
        <button type="button" class="admin-logout" id="btnSair">Sair</button>
      </div>
    </div>
  </header>

  <main class="admin-main">

    <h1 class="admin-title">Bilhetes</h1>
    <p class="admin-subtitle">Gere, ativa e valida todos os bilhetes emitidos.</p>

    <div class="admin-actions">
      <span id="contador" style="font-size:14px;color:var(--cinza)"></span>
      <button type="button" class="btn btn-primary" id="btnNovo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14"></path><path d="M5 12h14"></path>
        </svg>
        Emitir bilhete
      </button>
    </div>

    <div class="admin-filters-bar">
      <div class="admin-search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input type="search" id="busca" placeholder="Procurar por código ou nome do comprador…">
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select class="admin-select" id="filtroEvento">
          <option value="">Todos os eventos</option>
        </select>
        <select class="admin-select" id="filtroEstado">
          <option value="">Todos os estados</option>
          <option value="pendente">Pendente</option>
          <option value="ativo">Ativo</option>
          <option value="cancelado">Cancelado</option>
        </select>
        <select class="admin-select" id="filtroTipo">
          <option value="">Todos os tipos</option>
          <option value="normal">Normal</option>
          <option value="vip">VIP</option>
        </select>
      </div>
    </div>

    <div id="loading" class="admin-loading">A carregar bilhetes…</div>
    <div id="lista" class="admin-tickets"></div>

  </main>

  <!-- MODAL: EMITIR BILHETE -->
  <div class="admin-modal-backdrop" id="modalEmitir">
    <div class="admin-modal" role="dialog" aria-modal="true">
      <div class="admin-modal-header">
        <h2>Emitir bilhete</h2>
        <button type="button" class="admin-modal-close" data-fechar>×</button>
      </div>

      <form id="formEmitir">
        <div class="admin-modal-body">
          <div class="admin-alert" id="alertaEmitir"></div>

          <div class="form-row">
            <label class="form-label" for="evento_id">Evento *</label>
            <select class="form-select" id="evento_id" name="evento_id" required>
              <option value="">— Escolhe um evento —</option>
            </select>
          </div>

          <div class="form-grid">
            <div class="form-row">
              <label class="form-label" for="comprador_nome">Nome do comprador</label>
              <input class="form-input" type="text" id="comprador_nome" name="comprador_nome" maxlength="80">
            </div>
            <div class="form-row">
              <label class="form-label" for="comprador_telefone">Telefone</label>
              <input class="form-input" type="tel" id="comprador_telefone" name="comprador_telefone" maxlength="20" placeholder="ex: 84 000 0000">
            </div>
          </div>

          <div class="form-row">
            <label class="form-label" for="tipo">Tipo de bilhete *</label>
            <select class="form-select" id="tipo" name="tipo" required>
              <option value="normal">Normal</option>
              <option value="vip">VIP</option>
            </select>
          </div>

          <label class="form-check">
            <input type="checkbox" id="marcarPago">
            <span>Marcar como pago (bilhete fica ativo imediatamente)</span>
          </label>
        </div>

        <div class="admin-modal-footer">
          <button type="button" class="btn" data-fechar style="background:rgba(255,255,255,.06);color:#fff">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnEmitir">Emitir bilhete</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: HISTÓRICO -->
  <div class="admin-modal-backdrop" id="modalHistorico">
    <div class="admin-modal" role="dialog" aria-modal="true">
      <div class="admin-modal-header">
        <h2 id="histTitulo">Histórico do bilhete</h2>
        <button type="button" class="admin-modal-close" data-fechar>×</button>
      </div>
      <div class="admin-modal-body" id="histCorpo">
        <div class="admin-loading">A carregar…</div>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="bilhetes.js"></script>

</body>
</html>
