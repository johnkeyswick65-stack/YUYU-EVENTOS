<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Acessos · YUYU EVENTOS</title>
  <link rel="stylesheet" href="admin.css?v=11">
</head>
<body>

  <header class="admin-header">
    <div class="admin-header-inner">
      <div class="admin-brand">
        <svg class="admin-brand-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="8" height="8" rx="1.5"></rect>
          <rect x="13" y="3" width="8" height="8" rx="1.5"></rect>
          <rect x="3" y="13" width="8" height="8" rx="1.5"></rect>
          <rect x="13" y="13" width="8" height="8" rx="1.5"></rect>
        </svg>
        <span class="admin-brand-text">YUYU <span class="admin-brand-accent">EVENTOS</span></span>
        <span class="admin-brand-badge">Painel</span>
      </div>
      <nav class="admin-nav">
        <a class="admin-nav-link" href="dashboard.html">Dashboard</a>
        <a class="admin-nav-link" href="eventos.html">Eventos</a>
        <a class="admin-nav-link" href="bilhetes.html">Bilhetes</a>
        <a class="admin-nav-link" href="scanner.html">Scanner</a>
        <a class="admin-nav-link is-active" href="acessos.html">Acessos</a>
        <a class="admin-nav-link" href="armazenamento.html">Armazenamento</a>
      </nav>
      <div class="admin-user">
        <span class="admin-username" id="nomeAdmin">—</span>
        <button type="button" class="admin-logout" id="btnSair">Sair</button>
      </div>
    </div>
  </header>

  <main class="admin-main">

    <h1 class="admin-title">Acessos</h1>
    <p class="admin-subtitle">Monitorize e bloqueie acessos suspeitos ao backend.</p>

    <div id="loading" class="admin-loading">A carregar…</div>
    <div id="conteudo" style="display:none">

      <section class="dash-section">
        <div class="dash-section-head">
          <h2 class="dash-section-title">IPs activos nas últimas 24h</h2>
          <button type="button" class="admin-btn admin-btn-edit" id="btnAtualizar">Atualizar</button>
        </div>
        <div class="admin-card" id="listaIPs"></div>
      </section>

      <section class="dash-section">
        <div class="dash-section-head">
          <h2 class="dash-section-title">IPs bloqueados</h2>
        </div>
        <div class="admin-card" id="listaBloqueados"></div>
      </section>

      <section class="dash-section">
        <div class="dash-section-head">
          <h2 class="dash-section-title">Últimos acessos</h2>
          <div class="acc-filtros">
            <button type="button" class="admin-filter is-active" data-filtro="todos">Todos</button>
            <button type="button" class="admin-filter" data-filtro="suspeitos">Suspeitos</button>
          </div>
        </div>
        <div class="admin-card" id="listaAcessos"></div>
      </section>

    </div>

  </main>

  <script src="api.js"></script>
  <script src="acessos.js?v=1"></script>

</body>
</html>
